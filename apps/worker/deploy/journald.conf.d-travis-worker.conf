# =============================================================================
# TRAVIS Worker — journald drop-in 설정
# =============================================================================
# 작성일: 2026-04-30 (M1.7 Step 0 Substep 0.4)
# 대상: Hetzner CPX22 / Ubuntu 24.04 / systemd-journald
# 목적: travis-worker 로그가 디스크를 무한 점유하지 않도록 회전(rotation)
#       정책을 정의. 전역 /etc/systemd/journald.conf 를 직접 수정하지 않고
#       drop-in 패턴으로 분리하여 다른 서비스 영향 최소화.
#
# -----------------------------------------------------------------------------
# 비전공자용 설명
# -----------------------------------------------------------------------------
# - journald: systemd 가 모든 서비스 로그를 한 곳에 모으는 시스템.
# - drop-in: 메인 설정 파일을 건드리지 않고, 별도 폴더에 작은 설정 조각을
#   놓으면 systemd 가 자동으로 합쳐서 적용. 롤백 시 이 파일만 지우면 됨.
# - 이 설정이 없으면 worker 가 며칠 돌면 GB 단위 로그가 쌓여 디스크 압박.
# - 락아웃/데이터 손실 위험 없음: 이 파일 삭제 + journald 재시작으로 즉시 원복.
#
# -----------------------------------------------------------------------------
# 설치 방법 (3 단계, 서버 root 권한)
# -----------------------------------------------------------------------------
# 1) Local PowerShell 에서 서버로 업로드:
#    scp apps/worker/deploy/journald.conf.d-travis-worker.conf \
#        root@<server-ip>:/tmp/
#
# 2) 서버 root 에서 drop-in 디렉토리에 복사 (디렉토리 없으면 생성):
#    sudo mkdir -p /etc/systemd/journald.conf.d
#    sudo cp /tmp/journald.conf.d-travis-worker.conf \
#            /etc/systemd/journald.conf.d/travis-worker.conf
#    sudo chmod 644 /etc/systemd/journald.conf.d/travis-worker.conf
#
# 3) journald 재시작 (기존 로그는 유지됨):
#    sudo systemctl restart systemd-journald
#
# -----------------------------------------------------------------------------
# 검증 방법
# -----------------------------------------------------------------------------
# - 적용된 설정 확인 (모든 [Journal] 섹션 합쳐서 출력):
#   systemd-analyze cat-config systemd/journald.conf
#
# - 현재 디스크 사용량 확인:
#   journalctl --disk-usage
#   (출력 예: "Archived and active journals take up 120.0M in the file system.")
#
# - 회전 강제 실행 (옵션, 즉시 정리):
#   sudo journalctl --rotate
#   sudo journalctl --vacuum-size=500M
#
# -----------------------------------------------------------------------------
# 롤백 방법
# -----------------------------------------------------------------------------
# - 이 drop-in 만 제거 (다른 서비스 영향 없음):
#   sudo rm /etc/systemd/journald.conf.d/travis-worker.conf
#   sudo systemctl restart systemd-journald
# =============================================================================

[Journal]
# 디스크 사용량 상한 (CPX22 80GB 중 500MB 만 — worker 로그가 디스크 압박 못 하게)
SystemMaxUse=500M

# 단일 로그 파일 최대 (rotate 단위 — 50MB 마다 새 파일 생성)
SystemMaxFileSize=50M

# 보관 기간 상한 (30일 초과 로그는 디스크 압력 시 삭제 우선)
MaxRetentionSec=30day

# rate limit (worker 가 burst 로그 시에도 누락 방지 — 30초당 10000줄까지 허용)
RateLimitIntervalSec=30s
RateLimitBurst=10000
